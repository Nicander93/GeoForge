# GeoForge 3D — product Rust workspace (virtual; not the converter package).
[workspace]
members = [
  "crates/protocol",
  "crates/processor",
  "crates/top_rebuild",
  "crates/rebuild_top_cli",
]
default-members = [
  "crates/protocol",
  "crates/processor",
  "crates/top_rebuild",
]
exclude = [
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
authors = ["GeoForge"]
