<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoForge 地形预览</title>
  <script>window.CESIUM_BASE_URL = './vendor/cesium/';</script>
  <script src="./vendor/cesium/Cesium.js"></script>
  <link href="./vendor/cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; overflow:hidden; background:#1a2333; }
    #errorBanner {
      display:none; position:absolute; left:12px; top:12px; right:12px; z-index:10; padding:10px 12px;
      border-radius:8px; background:rgba(120,24,40,.92); color:#ffe1e1; font:13px/1.5 system-ui,sans-serif;
      word-break:break-word;
    }
    #errorBanner.show { display:block; }
    #pickLine {
      position:absolute; left:12px; bottom:12px; z-index:10; padding:6px 10px; border-radius:6px;
      background:rgba(20,24,32,.82); color:#e8eefc; font:12px/1.4 system-ui,sans-serif; pointer-events:none;
    }
    #pickLine:empty { display:none; }
    .cesium-viewer-cesiumInspectorContainer { display:none; }
  </style>
</head>
<body>
  <div id="errorBanner" role="alert"></div>
  <div id="pickLine"></div>
  <div id="cesiumContainer"></div>
  <script type="module">
    import { parseBounds, overviewRectangle, edgeView, realHeight, looksGzip, firstTileUrl, rampColor, transitionWidthM, perimeterPoints, transitionMesh } from './terrain-view.mjs';

    const params = new URL(window.location.href).searchParams;
    const terrainUrl = params.get('terrain');
    const bounds = parseBounds(params.get('bounds'));
    const heights = { min: Number(params.get('hmin')), max: Number(params.get('hmax')) };
    let exaggeration = Number(params.get('ex')) || 1;
    let shading = params.get('shading') || 'ramp';
    let showTransition = params.get('transition') !== '0';

    function postParent(message) {
      if (window.parent && window.parent !== window) window.parent.postMessage(message, window.location.origin);
    }
    function showError(message) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = message;
      banner.classList.add('show');
      postParent({ type: 'geoforge-terrain-error', message });
    }

    Cesium.Ion.defaultAccessToken = undefined;
    // Offline by design: no ion, no imagery, no geocoder. Online maps are not
    // a condition for a successful preview.
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false, geocoder: false, homeButton: false,
      sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false, infoBox: false,
      selectionIndicator: false, baseLayer: false,
    });
    // The Cesium moon texture (Assets/Textures/moonSmall.jpg) has no clear
    // redistribution terms, so it is not shipped and the moon is not drawn.
    // Destroy it before the first frame so the texture is never requested.
    if (viewer.scene.moon) viewer.scene.moon = viewer.scene.moon.destroy();
    viewer.extend(Cesium.viewerCesiumInspectorMixin);
    viewer.imageryLayers.removeAll();
    const scene = viewer.scene;
    const globe = scene.globe;
    globe.baseColor = Cesium.Color.fromCssColorString('#3a4658');
    globe.depthTestAgainstTerrain = true;
    scene.skyAtmosphere.show = false;
    scene.fog.enabled = false;
    globe.showGroundAtmosphere = false;
    window.__geoforgeTerrain = { viewer };

    function rampImage() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 1;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 256, 0);
      [[0, '#2b5c8a'], [0.25, '#3f8f6b'], [0.5, '#b9b35c'], [0.75, '#a8703f'], [1, '#f2efe9']].forEach(([at, color]) => gradient.addColorStop(at, color));
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 256, 1);
      return canvas;
    }
    function applyShading(mode) {
      const min = Number.isFinite(heights.min) ? heights.min : 0;
      const max = Number.isFinite(heights.max) && heights.max > min ? heights.max : min + 1;
      if (mode === 'ramp') {
        globe.material = Cesium.Material.fromType('ElevationRamp', {
          image: rampImage(), minimumHeight: min * exaggeration, maximumHeight: max * exaggeration,
        });
      } else if (mode === 'contour') {
        const spacing = Math.max(1, Math.pow(10, Math.floor(Math.log10(Math.max(max - min, 10)))) / 2);
        globe.material = Cesium.Material.fromType('ElevationContour', {
          color: Cesium.Color.fromCssColorString('#ffd36b'), spacing: spacing * exaggeration, width: 1.5,
        });
      } else {
        globe.material = undefined;
      }
    }
    // Display-only band outside the data: edge heights tapered to 0 m. It is
    // a separate primitive; no terrain tile is changed.
    let transition = null;
    let transitionPrimitive = null;
    async function prepareTransition(provider) {
      const points = perimeterPoints(bounds, 96);
      // Sample just inside the edge so the band starts on the data.
      const inset = 1e-6;
      const cartos = points.map((p) => Cesium.Cartographic.fromDegrees(
        Math.min(Math.max(p.lon, bounds[0] + inset), bounds[2] - inset),
        Math.min(Math.max(p.lat, bounds[1] + inset), bounds[3] - inset)));
      const sampled = await Cesium.sampleTerrainMostDetailed(provider, cartos);
      const widthM = transitionWidthM(bounds);
      transition = { widthM, mesh: transitionMesh(points, sampled.map((c) => c.height), widthM) };
    }
    function drawTransition() {
      if (transitionPrimitive) { scene.primitives.remove(transitionPrimitive); transitionPrimitive = null; }
      if (!transition || !showTransition) return;
      const { vertices, indices } = transition.mesh;
      const min = Number.isFinite(heights.min) ? heights.min : 0;
      const max = Number.isFinite(heights.max) && heights.max > min ? heights.max : min + 1;
      const positions = new Float64Array(vertices.length * 3);
      const colors = new Uint8Array(vertices.length * 4);
      const base = [58, 70, 88];
      vertices.forEach((v, i) => {
        const c = Cesium.Cartesian3.fromDegrees(v.lon, v.lat, v.height * exaggeration);
        positions[i * 3] = c.x; positions[i * 3 + 1] = c.y; positions[i * 3 + 2] = c.z;
        // Ramp colour, slightly greyed so the synthetic band stays recognisable.
        const rgb = shading === 'ramp' ? rampColor(v.height, min, max).map((x, k) => Math.round(x * 0.8 + 128 * 0.2)) : base;
        colors.set([rgb[0], rgb[1], rgb[2], 255], i * 4);
      });
      const geometry = new Cesium.Geometry({
        attributes: {
          position: new Cesium.GeometryAttribute({ componentDatatype: Cesium.ComponentDatatype.DOUBLE, componentsPerAttribute: 3, values: positions }),
          color: new Cesium.GeometryAttribute({ componentDatatype: Cesium.ComponentDatatype.UNSIGNED_BYTE, componentsPerAttribute: 4, normalize: true, values: colors }),
        },
        indices: new Uint32Array(indices),
        primitiveType: Cesium.PrimitiveType.TRIANGLES,
        boundingSphere: Cesium.BoundingSphere.fromVertices(Array.from(positions)),
      });
      transitionPrimitive = scene.primitives.add(new Cesium.Primitive({
        geometryInstances: new Cesium.GeometryInstance({ geometry }),
        appearance: new Cesium.PerInstanceColorAppearance({ flat: true, translucent: false }),
        asynchronous: false, compressVertices: false,
      }));
      window.__geoforgeTerrain.transition = { widthM: transition.widthM, vertices: vertices.length, shown: true };
    }

    function applyStyle(style) {
      if (Number.isFinite(style.exaggeration) && style.exaggeration > 0) {
        exaggeration = style.exaggeration;
        scene.verticalExaggeration = exaggeration;
      }
      shading = style.shading || 'ramp';
      if (typeof style.transition === 'boolean') showTransition = style.transition;
      applyShading(shading);
      drawTransition();
      if (!showTransition && window.__geoforgeTerrain.transition) window.__geoforgeTerrain.transition.shown = false;
      viewer.cesiumInspector.viewModel.wireframe = Boolean(style.wireframe);
    }
    function flyOverview(duration = 0) {
      if (!bounds) return;
      const [w, s, e, n] = overviewRectangle(bounds);
      viewer.camera.flyTo({ destination: Cesium.Rectangle.fromDegrees(w, s, e, n), duration });
    }
    function flyEdge(duration = 1) {
      if (!bounds) return;
      const view = edgeView(bounds, heights, exaggeration);
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(view.lon, view.lat, view.height),
        orientation: { heading: Cesium.Math.toRadians(view.headingDeg), pitch: Cesium.Math.toRadians(view.pitchDeg), roll: 0 },
        duration,
      });
    }

    let idleSent = false;
    globe.tileLoadProgressEvent.addEventListener((queued) => {
      if (queued === 0 && globe.tilesLoaded) {
        if (!idleSent) postParent({ type: 'geoforge-terrain-idle' });
        idleSent = true;
      } else {
        idleSent = false;
      }
    });

    const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
    handler.setInputAction((movement) => {
      const ray = viewer.camera.getPickRay(movement.endPosition);
      const position = ray && globe.pick(ray, scene);
      const line = document.getElementById('pickLine');
      if (!position) { line.textContent = ''; return; }
      const carto = Cesium.Cartographic.fromCartesian(position);
      const height = realHeight(carto.height, exaggeration, scene.verticalExaggerationRelativeHeight || 0);
      const lon = Cesium.Math.toDegrees(carto.longitude), lat = Cesium.Math.toDegrees(carto.latitude);
      const inside = bounds && lon >= bounds[0] && lon <= bounds[2] && lat >= bounds[1] && lat <= bounds[3];
      line.textContent = `经度 ${lon.toFixed(6)}° 纬度 ${lat.toFixed(6)}° 高程 ${height == null ? '—' : height.toFixed(2) + ' m'}` +
        (inside ? '' : '（数据范围外：0 m 平面和边缘过渡坡面只用于显示，不是成果数据）');
      postParent({ type: 'geoforge-terrain-pick', lon, lat, height, inside: Boolean(inside) });
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin || event.source !== window.parent) return;
      const data = event.data || {};
      if (data.type === 'geoforge-terrain-view') data.view === 'edge' ? flyEdge() : flyOverview(1);
      if (data.type === 'geoforge-terrain-style') applyStyle(data);
    });

    async function checkFirstTile(layer) {
      // Cesium cannot parse a compressed tile; name the server problem instead
      // of showing an empty globe.
      const url = firstTileUrl(terrainUrl, layer);
      const response = await fetch(url);
      if (!response.ok) throw new Error(`第 0 层瓦片无法读取（HTTP ${response.status}）：${url}`);
      const bytes = new Uint8Array(await response.arrayBuffer());
      if (looksGzip(bytes)) {
        throw new Error('瓦片是 gzip 压缩数据，但资源服务没有返回 Content-Encoding: gzip，Cesium 无法解析。请检查本地资源服务。');
      }
    }

    async function start() {
      if (!terrainUrl) throw new Error('没有指定地形成果');
      if (!bounds) throw new Error('成果报告中没有有效的数据范围，无法定位');
      postParent({ type: 'geoforge-terrain-loading' });
      const layerResponse = await fetch(new URL('layer.json', terrainUrl).href);
      if (!layerResponse.ok) throw new Error(`layer.json 无法读取（HTTP ${layerResponse.status}）`);
      const layer = await layerResponse.json();
      await checkFirstTile(layer);
      const provider = await Cesium.CesiumTerrainProvider.fromUrl(terrainUrl, { requestVertexNormals: false, requestWaterMask: false });
      provider.errorEvent.addEventListener((error) => {
        showError(`地形瓦片加载失败：${error.message || error}`);
      });
      viewer.terrainProvider = provider;
      window.__geoforgeTerrain.provider = provider;
      try {
        await prepareTransition(provider);
      } catch (error) {
        console.warn('edge transition skipped', error);
      }
      applyStyle({ exaggeration, shading, wireframe: params.get('wireframe') === '1' });
      flyOverview(0);
      postParent({ type: 'geoforge-terrain-ready', maxLevel: (layer.available || []).length - 1, transitionWidthM: transition ? transition.widthM : null });
    }
    start().catch((error) => showError(`地形加载失败：${error && error.message ? error.message : error}`));
  </script>
</body>
</html>
