name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-nsis:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # IFC tool (tools/ifc) is pinned to Python 3.12. Set it up first so the
      # 3.11 step below stays the default python for the texture tool.
      - uses: actions/setup-python@v5
        id: ifc-python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ifc/requirements.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $ver = '0.0.0-ci'
          }
          Write-Host "Package version: $ver"
          echo "PACKAGE_VERSION=$ver" >> $env:GITHUB_ENV

          foreach ($path in @(
            'apps/desktop/src-tauri/tauri.conf.json',
            'apps/desktop/package.json'
          )) {
            $full = (Resolve-Path $path).Path
            $text = [IO.File]::ReadAllText($full)
            if ($text -match ('"version"\s*:\s*"' + [regex]::Escape($ver) + '"')) {
              Write-Host "Already at $ver : $path"
              continue
            }
            $updated = [regex]::Replace(
              $text,
              '"version"\s*:\s*"[^"]*"',
              ('"version": "' + $ver + '"'),
              1
            )
            if ($updated -eq $text) {
              throw "Failed to patch version in $path"
            }
            [IO.File]::WriteAllText($full, $updated)
            Write-Host "Patched $path -> $ver"
          }

      - name: Install desktop npm deps
        working-directory: apps/desktop
        run: |
          npm ci
          npm test

      # Terrain runtime (required component): conda env from the lock, CTB
      # at the pinned commit, cmake/ninja for the build only.
      - name: Build terrain runtime
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'terrain-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $mm = Join-Path $tools 'micromamba.exe'
          Invoke-WebRequest 'https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64' -OutFile $mm
          $hash = (Get-FileHash $mm -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a6d804394b2418991c4e29562853eaace2f2ce9d9da661a98e74e02e8dbb44b0') { throw "micromamba sha256 $hash" }
          $env:MAMBA_ROOT_PREFIX = Join-Path $tools 'mamba'
          $condaEnv = Join-Path $tools 'env'
          $buildTools = Join-Path $tools 'build'
          & $mm create -y -q -p $condaEnv -f tools/terrain-runtime/conda-win64.lock
          if ($LASTEXITCODE -ne 0) { throw "terrain conda env failed" }
          & $mm create -y -q -p $buildTools -c conda-forge cmake=4.4.4 ninja=1.13.2
          if ($LASTEXITCODE -ne 0) { throw "terrain build tools failed" }
          $ctb = Join-Path $tools 'ctb'
          git clone -q https://github.com/ahuarte47/cesium-terrain-builder.git $ctb
          git -C $ctb -c advice.detachedHead=false checkout -q 776b60308c89383462a91d152a190fcd667b74f7
          pwsh -NoProfile -File tools/terrain-runtime/build-terrain-runtime.ps1 -CondaEnv $condaEnv -CtbSource $ctb -BuildTools $buildTools -OutDir dist/terrain-runtime
          if ($LASTEXITCODE -ne 0) { throw "terrain runtime build failed" }

      - name: Package Windows NSIS
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          $vcpkgOut = Join-Path $env:RUNNER_TEMP 'geoforge-vcpkg'
          vcpkg install basisu:x64-windows --x-install-root=$vcpkgOut
          $basisu = Join-Path $vcpkgOut 'x64-windows\tools\basisu\basisu.exe'
          pwsh -NoProfile -File apps/desktop/scripts/prepare-texture.ps1 -BasisuPath $basisu
          pwsh -NoProfile -File apps/desktop/scripts/prepare-ifc.ps1 -PythonCommand '${{ steps.ifc-python.outputs.python-path }}'
          pwsh -NoProfile -File apps/desktop/scripts/package-windows.ps1 -TerrainRuntime dist/terrain-runtime

      - name: Verify packaged native runtime
        shell: pwsh
        run: |
          $runtime = (Resolve-Path 'apps/desktop/src-tauri/resources/runtime').Path
          $converter = Join-Path $runtime 'converter'
          $bin = Join-Path $runtime 'bin'
          $texture = Join-Path $runtime 'texture'
          $ifc = Join-Path $runtime 'ifc'
          $required = @(
            (Join-Path $converter '_3dtile.exe'),
            (Join-Path $converter 'msvcp140.dll'),
            (Join-Path $converter 'msvcp140_2.dll'),
            (Join-Path $converter 'vcruntime140.dll'),
            (Join-Path $converter 'vcruntime140_1.dll'),
            (Join-Path $bin 'processor.exe'),
            (Join-Path $bin 'top_rebuild.exe'),
            (Join-Path $bin 'msvcp140.dll'),
            (Join-Path $bin 'vcruntime140.dll')
            (Join-Path $texture 'geoforge-texture.exe')
            (Join-Path $texture 'basisu.exe')
            (Join-Path $ifc 'geoforge-ifc.exe')
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Packaged runtime is missing: $($missing -join ', ')"
          }
          Push-Location $converter
          & (Join-Path $converter '_3dtile.exe') --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "_3dtile.exe --help failed with exit=$LASTEXITCODE" }
          Pop-Location
          # The desktop app launches processor with GEOFORGE_RUNTIME_ROOT set to the bundled
          # runtime; mirror that here so discovery uses runtime/ifc instead of a repo fallback.
          $env:GEOFORGE_RUNTIME_ROOT = $runtime
          $capabilities = & (Join-Path $bin 'processor.exe') capabilities --json
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($capabilities -join ''))) {
            throw "processor capabilities smoke failed with exit=$LASTEXITCODE"
          }
          $ifcCapability = ($capabilities -join '' | ConvertFrom-Json).ifc
          if (-not $ifcCapability.ready -or $ifcCapability.kind -ne 'executable') {
            throw "processor does not see the packaged IFC tool: $($ifcCapability | ConvertTo-Json -Compress)"
          }
          Write-Host 'Packaged converter, processor and IFC runtime smoke passed.'

      # Install the NSIS package silently on this fresh runner and run the
      # terrain smoke against the installed copy (system-only PATH).
      - name: Install NSIS package and smoke the installed terrain runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter *.exe -File | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'geoforge-installed'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $runtime = Get-ChildItem $dir -Recurse -Directory -Filter runtime | Where-Object { Test-Path (Join-Path $_.FullName 'terrain\manifest.json') } | Select-Object -First 1
          if (-not $runtime) { throw "installed package has no runtime\terrain under $dir" }
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          pwsh -NoProfile -File tools/terrain-runtime/smoke-terrain-runtime.ps1 -RuntimeRoot $runtime.FullName -Report dist/installer/terrain-smoke-installed.json
          if ($LASTEXITCODE -ne 0) { throw "installed terrain smoke failed" }
          Copy-Item dist/terrain-smoke-staged.json dist/installer/ -ErrorAction SilentlyContinue
          Copy-Item dist/terrain-runtime/sbom.spdx.json dist/installer/terrain-sbom.spdx.json
          Copy-Item dist/terrain-runtime/manifest.json dist/installer/terrain-manifest.json

      - name: Collect installer + SHA256
        shell: pwsh
        run: |
          $nsis = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          if (-not (Test-Path $nsis)) {
            throw "NSIS output dir missing: $nsis"
          }
          $exes = Get-ChildItem $nsis -Filter *.exe -File
          if ($exes.Count -lt 1) {
            throw "No NSIS .exe under $nsis"
          }
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          foreach ($exe in $exes) {
            Copy-Item -Force $exe.FullName (Join-Path 'dist/installer' $exe.Name)
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Encoding ascii (Join-Path 'dist/installer' "$($exe.Name).sha256") $hash
            Write-Host "Asset $($exe.Name) sha256=$hash"
          }
          Get-ChildItem dist/installer | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: dist/installer/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
