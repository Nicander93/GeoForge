name: Product Core

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - name: Install GTK and WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build product crates (no OSG/GDAL)
        run: cargo build
      - name: Test protocol + processor
        run: |
          cargo test -p geoforge-protocol
          cargo test -p processor --lib
      - name: Test complete Rust workspace
        run: cargo test
      - name: Processor capabilities smoke
        run: cargo run -p processor --quiet -- capabilities --json
      - name: Run D0 acceptance tests
        run: |
          cargo build --release -p processor
          cd docs/acceptance/v1-convergence
          ./scripts/run-acceptance.sh --level d0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run build
      # Browser interactions submit tasks to the actual processor using isolated fixtures.
      - name: Tileset merge and clipping end-to-end tests
        working-directory: apps/desktop
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Prepare desktop sidecars
        working-directory: apps/desktop
        run: npm run prepare:sidecars
      - name: Test desktop Tauri library
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked
