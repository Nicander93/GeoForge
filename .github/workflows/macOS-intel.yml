name: macOS-intel

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build product crates (no OSG/GDAL)
        run: cargo build
      - name: Test protocol + processor
        run: |
          cargo test -p geoforge-protocol
          cargo test -p processor --lib
      - name: Processor capabilities smoke
        run: cargo run -p processor --quiet -- capabilities --json
